AutoName: NeoTube
Summary: Ad-free video & music streaming with background play and SponsorBlock
Description: |-
  NeoTube is a modern, privacy-respecting video and music streaming client for Android.

  Features:
  * Ad-free video and audio streaming
  * Background and lock-screen playback
  * Picture-in-Picture (PiP) mode
  * SponsorBlock, Return YouTube Dislike & DeArrow
  * Shorts feed with hands-free Auto-Scroll mode
  * 100% on-device local recommendation engine
  * Offline video and audio downloads
  * 100% FOSS with zero tracking or Google accounts required

